name: Deploy to VPS

# Requires GitHub repository secrets:
#   VPS_HOST      — IP address of your VPS
#   VPS_USER      — SSH user (e.g. root)
#   VPS_SSH_KEY   — Private SSH key (OpenSSH format, no passphrase)
#   VPS_APP_PATH  — Absolute path to app on VPS (e.g. /home/ubuntu/Fortress_Dashboard_v4)
#   SERVICE_NAME  — systemd service name (e.g. fortress-dashboard-v4)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Set up SSH key ────────────────────────────────────────────────────
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      # ── 2. Pull latest code on VPS ───────────────────────────────────────────
      - name: Pull latest code
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"             "cd ${{ secrets.VPS_APP_PATH }} &&               git fetch origin main &&               git reset --hard origin/main &&               echo 'Pull complete: '$(git log -1 --oneline)"

      # ── 3. Restart service ───────────────────────────────────────────────────
      - name: Restart service
        run: |
          ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"             "systemctl restart ${{ secrets.SERVICE_NAME }} &&               sleep 4 &&               systemctl is-active --quiet ${{ secrets.SERVICE_NAME }} &&               echo 'Service is running' ||               (journalctl -u ${{ secrets.SERVICE_NAME }} --no-pager -n 30; exit 1)"

      # ── 4. Health check ──────────────────────────────────────────────────────
      - name: Health check
        run: |
          sleep 5
          ssh -i ~/.ssh/id_deploy "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"             "curl -sf http://localhost:8080/api/health | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d); sys.exit(0 if d.get(\"status\") == \"ok\" else 1)'"
