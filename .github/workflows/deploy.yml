name: Deploy to VPS

# Triggers on every push to the main branch.
# Requires the following GitHub repository secrets to be set:
#   VPS_HOST        — IP address or hostname of your VPS
#   VPS_USER        — SSH user (e.g. root)
#   VPS_SSH_KEY     — Private SSH key (OpenSSH format, no passphrase)
#   VPS_APP_PATH    — Absolute path to the app directory on VPS
#   SERVICE_NAME    — systemd service name

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Set up SSH (no third-party action) ────────────────────────────────
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # ── 3. Sync files to VPS ─────────────────────────────────────────────────
      - name: Sync files to VPS
        run: |
          rsync -avz --delete             -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no"             --exclude='.git'             --exclude='.github'             --exclude='quant/active_positions.json'             --exclude='quant/ibkr_uploads.json'             --exclude='quant/journal.json'             --exclude='quant/alerts.json'             --exclude='quant/fortress_config.json'             --exclude='quant/uploads/'             --exclude='quant/backups/'             --exclude='quant/reports/'             --exclude='ib-gateway/.env'             --exclude='cp-gateway/.env'             --exclude='*.pyc'             --exclude='__pycache__/'             --exclude='*.egg-info/'             --exclude='.env'             --exclude='venv/'             --exclude='.venv/'             ./             "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_PATH }}/"

      # ── 4. Restart service ───────────────────────────────────────────────────
      - name: Restart dashboard service
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no             "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"             "sudo systemctl restart ${{ secrets.SERVICE_NAME }} && sleep 3 && systemctl is-active --quiet ${{ secrets.SERVICE_NAME }} && echo 'Service is running' || (journalctl -u ${{ secrets.SERVICE_NAME }} --no-pager -n 30; exit 1)"

      # ── 5. Health check ──────────────────────────────────────────────────────
      - name: Health check
        run: |
          sleep 5
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no             "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"             "curl -sf http://localhost:8080/api/health | grep -q 'ok' && echo 'Health check passed' || (echo 'Health check failed'; exit 1)"
